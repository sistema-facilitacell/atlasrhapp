<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Atlas RH — Gestão de Contratos</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
/* ── Reset & Vars ── */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0B1E35;--gold:#C9A84C;--gold2:#E8C96A;
  --bg:#F1F5F9;--white:#fff;--border:#E2E8F0;
  --tx:#1E293B;--mt:#64748B;
  --blue:#2563EB;--green:#059669;--red:#DC2626;
  --amber:#D97706;--purple:#7C3AED;--orange:#EA580C;
  --font:'Nunito',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;}

/* ── Layout ── */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
.sidebar{background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;}
.brand-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.brand-name{font-size:15px;font-weight:800;line-height:1.2;}
.brand-sub{font-size:10px;color:rgba(255,255,255,.5);font-weight:500;}
.nav-section{padding:10px 8px 4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);margin-top:8px;}
.ni{width:100%;background:none;border:none;color:rgba(255,255,255,.75);padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:13px;font-family:var(--font);font-weight:600;text-align:left;transition:all .15s;}
.ni:hover{background:rgba(255,255,255,.08);color:#fff;}
.ni.active{background:rgba(201,168,76,.18);color:var(--gold2);border-left:3px solid var(--gold);}
.ni .icon{width:18px;text-align:center;flex-shrink:0;font-size:15px;}
.ni .badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;min-width:18px;text-align:center;}
.content{padding:24px;overflow-y:auto;}

/* ── Topbar ── */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;grid-column:2;}
.page-title{font-size:18px;font-weight:800;}
.topbar-actions{display:flex;gap:10px;align-items:center;}

/* ── Cards ── */
.card{background:var(--white);border-radius:12px;border:1px solid var(--border);padding:20px;margin-bottom:16px;}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

/* ── Stats grid ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stat{background:var(--white);border-radius:12px;border:1px solid var(--border);padding:16px;cursor:pointer;transition:box-shadow .15s;}
.stat:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);}
.stat-label{font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.stat-val{font-size:26px;font-weight:900;}
.stat-sub{font-size:11px;color:var(--mt);margin-top:3px;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:700;transition:all .15s;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:#0d2a4a;}
.btn-blue{background:#EFF6FF;color:var(--blue);}
.btn-blue:hover{background:#DBEAFE;}
.btn-green{background:#F0FDF4;color:var(--green);}
.btn-green:hover{background:#DCFCE7;}
.btn-red{background:#FEF2F2;color:var(--red);}
.btn-red:hover{background:#FEE2E2;}
.btn-amber{background:#FFFBEB;color:var(--amber);}
.btn-amber:hover{background:#FEF3C7;}
.btn-ghost{background:#F8FAFC;color:var(--mt);}
.btn-ghost:hover{background:#F1F5F9;}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px;}
.btn-full{width:100%;}

/* ── Badges ── */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}

/* ── Table ── */
table{width:100%;border-collapse:collapse;}
thead th{font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);}
tbody td{padding:11px 12px;border-bottom:1px solid #F8FAFC;font-size:13px;vertical-align:middle;}
tbody tr:hover{background:#F8FAFC;}

/* ── Modal ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center;padding:16px;}
.overlay.open{display:flex;}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:16px;font-weight:800;}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1;}
.modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--mt);line-height:1;padding:2px 6px;border-radius:6px;}
.close-btn:hover{background:var(--border);color:var(--tx);}

/* ── Form ── */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.fld label{font-size:12px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.05em;}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;color:var(--tx);outline:none;transition:border-color .15s;background:var(--white);}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);}
.fld textarea{resize:vertical;min-height:80px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;}
.tab{background:none;border:none;padding:10px 18px;font-family:var(--font);font-size:13px;font-weight:700;color:var(--mt);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;border-radius:8px 8px 0 0;}
.tab:hover{color:var(--tx);background:#F8FAFC;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:99999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.2);}
#toast.show{transform:translateY(0);opacity:1;}
#toast.ok{background:var(--green);}
#toast.err{background:var(--red);}
#toast.warn{background:var(--amber);}

/* ── Avatar ── */
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 20px;color:var(--mt);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:6px;}
.empty-sub{font-size:13px;}

/* ── Alert box ── */
.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px;}
.alert-info{background:#EFF6FF;border:1px solid #BFDBFE;color:#1D4ED8;}
.alert-warn{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;}
.alert-red{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;}

/* ── Signature canvas ── */
#sig-canvas{border:2px solid var(--border);border-radius:10px;cursor:crosshair;touch-action:none;}
.sig-wrap{position:relative;background:#FAFAFA;border-radius:10px;overflow:hidden;}

/* ── Severity indicator ── */
.sev{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;}
.sev-dot{width:10px;height:10px;border-radius:50%;}

/* ── Timeline ── */
.timeline{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #F1F5F9;}
.tl-item:last-child{border-bottom:none;}
.tl-line{display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0;}
.tl-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.tl-vline{width:2px;flex:1;background:var(--border);margin:4px 0;}

/* ── Filter bar ── */
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-bar input,.filter-bar select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;background:var(--white);outline:none;}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--blue);}

/* ── Print styles ── */
@media print {
  .sidebar,.topbar,.btn,.filter-bar,.tabs,.modal{display:none!important;}
  body{background:#fff;}
  .card{border:1px solid #ddd;page-break-inside:avoid;}
  .doc-print-header{display:block!important;}
}
.doc-print-header{display:none;}
</style>
</head>

<script>
const FB_CONFIG = {
  apiKey: "AIzaSyCBOp8IrmkQbDkdC2fH81JeLlJjlzM_oA8",
  authDomain: "atlassaas.firebaseapp.com",
  projectId: "atlassaas",

  messagingSenderId: "900350981704",
  appId: "1:900350981704:web:5b926fda7cb3a6d5228a7d"
};
// ── Inicializa Firebase ──
let FBASE = null;
try {
  const _app = firebase.initializeApp(FB_CONFIG, 'contratos_mod');
  FBASE = firebase.firestore(_app);
  console.log('[Contratos] Firebase OK');
} catch(e) {
  console.warn('[Contratos] Firebase offline — modo local', e.message);
}

// ── Helpers ──
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${zp(d.getMonth()+1)}-${zp(d.getDate())}`; }
function zp(n){ return String(n).padStart(2,'0'); }
function fmtDate(s){ if(!s)return '—'; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fBRL(v){ return parseFloat(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

// ── App State ──
const APP = {
  employees: JSON.parse(localStorage.getItem('fcrh_employees') || '[]'),
  contratos:  JSON.parse(localStorage.getItem('fcrh_contratos') || '[]'),
  advertencias: JSON.parse(localStorage.getItem('fcrh_advertencias') || '[]'),
  suspensoes: JSON.parse(localStorage.getItem('fcrh_suspensoes') || '[]'),
  atestados:  JSON.parse(localStorage.getItem('fcrh_atestados') || '[]'),
  faltas:     JSON.parse(localStorage.getItem('fcrh_faltas_contr') || '[]'),
  holerites:  JSON.parse(localStorage.getItem('fcrh_holerites_contr') || '[]'),
};

function lsSave(k){ localStorage.setItem('fcrh_'+k, JSON.stringify(APP[k])); }

// ── Firebase sync ──
async function fbSave(k){
  if(!FBASE) return;
  try { await FBASE.collection('contratos_mod').doc(k).set({d:JSON.stringify(APP[k]),ts:Date.now()}); }
  catch(e){ console.warn('[fbSave]', k, e.message); }
}
async function fbLoad(k){
  if(!FBASE) return null;
  try {
    const s = await FBASE.collection('contratos_mod').doc(k).get();
    if(!s.exists) return null;
    return JSON.parse(s.data().d);
  } catch(e){ return null; }
}
async function loadAll(){
  const keys = ['employees','contratos','advertencias','suspensoes','atestados','faltas','holerites'];
  for(const k of keys){
    const d = await fbLoad(k);
    if(d) { APP[k]=d; lsSave(k); }
  }
}
</script>

<script>
// ══════════════════════════════════════════════════════════════
// CORE UI
// ══════════════════════════════════════════════════════════════
let CURRENT_MOD = 'faltas';

const PAGE_TITLES = {
  faltas:'Faltas',atestados:'Atestados Médicos',holerites:'Holerites',
  advertencias:'Advertências',suspensoes:'Suspensões',
  colaboradores:'Colaboradores',
  dashboard:'Painel Geral',assinaturas:'Assinaturas Pendentes'
};
const PAGE_SUBS = {
  faltas:'Lançamento e controle de ausências',atestados:'Gestão de atestados médicos e licenças',
  holerites:'Emissão e assinatura de contracheques',advertencias:'Registro de advertências disciplinares',
  suspensoes:'Controle de suspensões',colaboradores:'Cadastro de colaboradores deste módulo',
  dashboard:'Visão consolidada por colaborador',
  assinaturas:'Holerites e documentos aguardando assinatura'
};

function nav(mod){
  CURRENT_MOD = mod;
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('ni-'+mod);
  if(btn) btn.classList.add('active');
  document.getElementById('page-title').textContent = PAGE_TITLES[mod] || mod;
  document.getElementById('page-sub').textContent = PAGE_SUBS[mod] || '';
  const btnNovEl = document.getElementById('btn-novo');
  const novoLabels = {colaboradores:'+ Novo Colaborador',faltas:'+ Novo Lançamento',atestados:'+ Novo Atestado',holerites:'+ Novo Holerite',advertencias:'+ Nova Advertência',suspensoes:'+ Nova Suspensão'};
  btnNovEl.textContent = novoLabels[mod] || '+ Novo Lançamento';
  btnNovEl.style.display = mod==='dashboard'?'none':'inline-flex';
  renderPage();
}

function renderPage(){
  const renders = {
    faltas: renderFaltas, atestados: renderAtestados, holerites: renderHolerites,
    advertencias: renderAdvertencias, suspensoes: renderSuspensoes,
    colaboradores: renderColaboradores,
    dashboard: renderDashboard, assinaturas: renderAssinaturas
  };
  document.getElementById('content').innerHTML = (renders[CURRENT_MOD] || renderDashboard)();
  postRender();
}

function postRender(){
  if(CURRENT_MOD === 'assinaturas') initSignaturePads();
  if(CURRENT_MOD === 'colaboradores') initColaboradoresEvents();
}

function btnNovo(){
  const actions = {
    faltas: () => modalFalta(),
    atestados: () => modalAtestado(),
    holerites: () => modalHolerite(),
    advertencias: () => modalAdvertencia(),
    suspensoes: () => modalSuspensao(),
    colaboradores: () => modalColaborador(),
    assinaturas: () => nav('holerites'),
    dashboard: () => toast('Selecione um módulo no menu','warn'),
  };
  (actions[CURRENT_MOD] || actions.dashboard)();
}

// Toast
let _toastTimer = null;
function toast(msg, type='', dur=3500){
  const el = document.getElementById('toast');
  el.innerHTML = msg;
  el.className = 'show ' + (type||'');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ el.className=''; }, dur);
}

// Modal
function openModal(title, bodyHtml, footerHtml=''){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-ft').innerHTML = footerHtml || '<button class="btn btn-ghost" onclick="closeModal()">Fechar</button>';
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

// Avatar
function av(nome, id, size=32){
  const colors = ['#2563EB','#059669','#DC2626','#D97706','#7C3AED','#0891B2','#EA580C','#BE185D'];
  const c = colors[(id||'').charCodeAt(1)%colors.length] || colors[0];
  const ini = (nome||'?').split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();
  return `<div class="av" style="width:${size}px;height:${size}px;background:${c};font-size:${Math.round(size*.38)}px">${ini}</div>`;
}

// Badge
function bdg(txt, color='#64748B'){
  const bg = color + '22';
  return `<span class="bdg" style="background:${bg};color:${color}">${txt}</span>`;
}

// Employee picker HTML
function empOptions(val=''){
  return APP.employees.filter(e=>e.status==='ativo')
    .map(e=>`<option value="${e.id}" ${val===e.id?'selected':''}>${esc(e.nome)} — ${esc(e.cargo)}</option>`)
    .join('');
}

// ══════════════════════════════════════════════════════════════
// 1. FALTAS
// ══════════════════════════════════════════════════════════════
function renderFaltas(){
  const search = document.getElementById('srch-faltas')?.value || '';
  const fil = APP.faltas.filter(f=>{
    if(!search) return true;
    const e = APP.employees.find(x=>x.id===f.empId);
    return (e?.nome||'').toLowerCase().includes(search.toLowerCase());
  }).sort((a,b)=>b.data.localeCompare(a.data));

  const stats = [
    {l:'Total Faltas',v:APP.faltas.length,c:'#DC2626',sub:'todos os registros'},
    {l:'Este Mês',v:APP.faltas.filter(f=>f.data&&f.data.startsWith(new Date().toISOString().slice(0,7))).length,c:'#D97706',sub:'mês atual'},
    {l:'Justificadas',v:APP.faltas.filter(f=>f.justificada).length,c:'#059669',sub:'com justificativa'},
    {l:'Injustificadas',v:APP.faltas.filter(f=>!f.justificada).length,c:'#7C3AED',sub:'sem justificativa'},
  ];

  return `
  <div class="stats">
    ${stats.map(s=>`<div class="stat" style="border-top:3px solid ${s.c}">
      <div class="stat-label">${s.l}</div>
      <div class="stat-val" style="color:${s.c}">${s.v}</div>
      <div class="stat-sub">${s.sub}</div>
    </div>`).join('')}
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="card-title" style="margin:0">📅 Registro de Faltas</div>
      <div class="filter-bar" style="margin:0">
        <input id="srch-faltas" placeholder="🔍 Buscar colaborador..." value="${esc(search)}"
          oninput="renderPage()" style="width:220px">
        <button class="btn btn-primary" onclick="modalFalta()">+ Lançar Falta</button>
      </div>
    </div>
    ${fil.length===0
      ? `<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">Nenhuma falta registrada</div><div class="empty-sub">Clique em "+ Lançar Falta" para registrar.</div></div>`
      : `<table>
          <thead><tr><th>Colaborador</th><th>Data</th><th>Tipo</th><th>Motivo</th><th>Status</th><th>Desconto</th><th>Ações</th></tr></thead>
          <tbody>
          ${fil.map(f=>{
            const e = APP.employees.find(x=>x.id===f.empId);
            return `<tr>

              <td>${f.justificada?bdg('Justificada','#059669'):bdg('Injustificada','#DC2626')}</td>

function calcDesconto(f){
  if(f.justificada && f.tipoJustif === 'atestado') return 0;
  const e = APP.employees.find(x=>x.id===f.empId);
  if(!e) return 0;
  const diaria = (e.salario||0) / 30;
  if(f.tipo==='integral') return diaria;
  const horas = parseFloat(f.horas||0);
  return (diaria / 8) * horas;
}

        <div class="fld" style="margin:0"><label>Outros venc.</label><input type="number" id="h-outros-venc" value="${h?.outrosVenc||''}" placeholder="0.00" step="0.01" oninput="calcLiquido()"></div>

      <div id="h-liquido-disp" style="font-size:22px;font-weight:900;color:var(--gold2)">R$ 0,00</div>
    </div>

      <textarea id="h-obs" placeholder="Observações...">${esc(h?.obs||'')}</textarea></div>

      function calcLiquido(){
        const b=parseFloat(document.getElementById('h-bruto').value||0);
        const he=parseFloat(document.getElementById('h-he').value||0);
        const com=parseFloat(document.getElementById('h-com').value||0);
        const ov=parseFloat(document.getElementById('h-outros-venc').value||0);
        const inss=parseFloat(document.getElementById('h-inss').value||0);
        const irrf=parseFloat(document.getElementById('h-irrf').value||0);
        const fd=parseFloat(document.getElementById('h-faltas').value||0);
        const ad=parseFloat(document.getElementById('h-adiant').value||0);
        const vt=parseFloat(document.getElementById('h-vt').value||0);
        const od=parseFloat(document.getElementById('h-outros-desc').value||0);
        const liq=b+he+com+ov-inss-irrf-fd-ad-vt-od;
        const el=document.getElementById('h-liquido-disp');
        if(el) el.textContent=liq.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
      }
      function preencherSalario(){
        const sid=document.getElementById('h-emp').value;
        const emp=window.APP.employees.find(x=>x.id===sid);
        if(emp&&emp.salario){
          document.getElementById('h-bruto').value=emp.salario;
          calcLiquido();
        }
      }
      document.getElementById('h-bruto').addEventListener('input',calcLiquido);
      calcLiquido();
    <\/script>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveHolerite('${id||''}')">💾 ${h?'Atualizar':'Emitir'} Holerite</button>
  `);
}

function saveHolerite(id){
  const empId = document.getElementById('h-emp').value;
  const competencia = document.getElementById('h-comp').value;
  if(!empId||!competencia){ toast('Preencha colaborador e competência!','err'); return; }
  const bruto = parseFloat(document.getElementById('h-bruto').value||0);
  const inss  = parseFloat(document.getElementById('h-inss').value||0);
  const irrf  = parseFloat(document.getElementById('h-irrf').value||0);
  const descFaltas = parseFloat(document.getElementById('h-faltas').value||0);
  const adiantamento = parseFloat(document.getElementById('h-adiant').value||0);
  const valeTransp = parseFloat(document.getElementById('h-vt').value||0);
  const outrosDesc = parseFloat(document.getElementById('h-outros-desc').value||0);
  const horasExtras = parseFloat(document.getElementById('h-he').value||0);
  const comissao = parseFloat(document.getElementById('h-com').value||0);
  const outrosVenc = parseFloat(document.getElementById('h-outros-venc').value||0);
  const descontos = inss+irrf+descFaltas+adiantamento+valeTransp+outrosDesc;
  const liquido = bruto+horasExtras+comissao+outrosVenc-descontos;

  const existing = APP.holerites.find(x=>x.id===id);
  const obj = {
    id: id||uid(), empId, competencia,
    salarioBruto:bruto, inss, irrf, descFaltas, adiantamento, valeTransp, outrosDesc,
    horasExtras, comissao, outrosVenc, descontos, liquido,
    obs: document.getElementById('h-obs').value,
    assinado: existing?.assinado||false,
    assinadoEm: existing?.assinadoEm||null,
    assinaturaData: existing?.assinaturaData||null,
    criadoEm: existing?.criadoEm||new Date().toISOString(),
  };
  const idx = APP.holerites.findIndex(x=>x.id===id);
  if(idx>=0) APP.holerites[idx]=obj; else APP.holerites.push(obj);
  lsSave('holerites'); fbSave('holerites');
  closeModal(); renderPage();
  toast('✅ Holerite salvo!','ok');
}

function saveSuspensao(id){
  const empId = document.getElementById('s-emp').value;
  const dataInicio = document.getElementById('s-inicio').value;
  const dataFim    = document.getElementById('s-fim').value;
  const motivo     = document.getElementById('s-motivo').value.trim();
  if(!empId||!dataInicio||!dataFim||!motivo){ toast('Preencha todos os campos obrigatórios!','err'); return; }
  const existing = APP.suspensoes.find(x=>x.id===id);
  const obj = {
    id:id||uid(), empId, dataInicio, dataFim, motivo,
    baseLegal: document.getElementById('s-base').value,
    testemunha1: document.getElementById('s-test1').value,
    testemunha2: document.getElementById('s-test2').value,
    desconto: document.getElementById('s-desconto').value==='1',
    assinado: existing?.assinado||false,
    assinadoEm: existing?.assinadoEm||null,
    assinaturaData: existing?.assinaturaData||null,
    criadoEm: existing?.criadoEm||new Date().toISOString(),
  };
  const idx = APP.suspensoes.findIndex(x=>x.id===id);
  if(idx>=0) APP.suspensoes[idx]=obj; else APP.suspensoes.push(obj);
  lsSave('suspensoes'); fbSave('suspensoes');
  closeModal(); renderPage();
  toast('✅ Suspensão salva!','ok');
}

function _abrirModalAssinatura(titulo, nomeFuncionario){
  openModal(titulo, `
    <div class="alert alert-info">✍️ O colaborador <strong>${esc(nomeFuncionario||'?')}</strong> deve assinar abaixo. Esta assinatura ficará registrada no documento.</div>
    <div class="sig-wrap" style="margin-bottom:14px">
      <canvas id="sig-canvas" width="580" height="180"></canvas>
    </div>

      <button class="btn btn-ghost btn-sm" onclick="sigClear()">🗑️ Limpar</button>

    <button class="btn btn-primary" onclick="confirmarAssinatura()">✅ Confirmar Assinatura</button>
  `);
  setTimeout(initSigCanvas, 50);

function initSigCanvas(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  _sigCtx = canvas.getContext('2d');
  _sigCtx.strokeStyle = '#0B1E35';
  _sigCtx.lineWidth = 2;
  _sigCtx.lineCap = 'round';
  _sigCtx.lineJoin = 'round';
  canvas.style.width = '100%';
  canvas.style.height = '180px';

  const getPos = (evt) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = evt.touches ? evt.touches[0] : evt;
    return { x:(src.clientX-rect.left)*scaleX, y:(src.clientY-rect.top)*scaleY };
  };
  canvas.onmousedown = canvas.ontouchstart = (e) => { e.preventDefault(); _sigDrawing=true; const p=getPos(e); _sigCtx.beginPath(); _sigCtx.moveTo(p.x,p.y); };
  canvas.onmousemove = canvas.ontouchmove = (e) => { e.preventDefault(); if(!_sigDrawing)return; const p=getPos(e); _sigCtx.lineTo(p.x,p.y); _sigCtx.stroke(); };
  canvas.onmouseup = canvas.onmouseleave = canvas.ontouchend = () => { _sigDrawing=false; };
}

function sigClear(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas||!_sigCtx) return;
  _sigCtx.clearRect(0,0,canvas.width,canvas.height);
}

function sigIsBlank(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return true;
  const data = _sigCtx.getImageData(0,0,canvas.width,canvas.height).data;
  for(let i=3;i<data.length;i+=4){ if(data[i]>0) return false; }
  return true;
}

function confirmarAssinatura(){
  if(sigIsBlank()){ toast('Desenhe a assinatura antes de confirmar!','err'); return; }
  const canvas = document.getElementById('sig-canvas');
  const sigData = canvas.toDataURL('image/png');
  const sigData64 = sigData;
  const nomeConf = document.getElementById('sig-nome-conf').value;
  const sigData2 = { assinado:true, assinadoEm:new Date().toISOString(), assinaturaData:sigData64, assinadoPor:nomeConf };

  if(_sigDocType==='holerite'){
    const h = APP.holerites.find(x=>x.id===_sigDocId);

const STATUS_COLAB = {
  ativo:      {label:'Ativo',      color:'#059669'},
  inativo:    {label:'Inativo',    color:'#64748B'},
  afastado:   {label:'Afastado',   color:'#D97706'},
  ferias:     {label:'Férias',     color:'#2563EB'},
  demitido:   {label:'Demitido',   color:'#DC2626'},
};

function renderColaboradores(){
  const q = (document.getElementById('colab-q')||{}).value?.toLowerCase()||'';
  const sf = (document.getElementById('colab-sf')||{}).value||'';
  const st = (document.getElementById('colab-st')||{}).value||'';
  let list = APP.employees.slice();
  if(q) list = list.filter(e=>(e.nome+e.cpf+e.cargo+e.departamento).toLowerCase().includes(q));
  if(sf) list = list.filter(e=>e.status===sf);
  if(st) list = list.filter(e=>e.tipoContrato===st);

  const countByStatus = Object.fromEntries(Object.keys(STATUS_COLAB).map(k=>[k,APP.employees.filter(e=>e.status===k).length]));

  return `
  <div class="stats" style="grid-template-columns:repeat(5,1fr)">
    ${Object.entries(STATUS_COLAB).map(([k,v])=>`
    <div class="stat" onclick="document.getElementById('colab-sf').value='${k}';renderPage()">
      <div class="stat-label">${v.label}</div>
      <div class="stat-val" style="color:${v.color}">${countByStatus[k]||0}</div>
    </div>`).join('')}
  </div>

  <div class="card">
    <div class="filter-bar">
      <input id="colab-q" placeholder="🔍 Buscar nome, CPF, cargo..." style="flex:1;min-width:200px" value="${q}" oninput="renderPage()">
      <select id="colab-sf" onchange="renderPage()">
        <option value="">Todos os status</option>
        ${Object.entries(STATUS_COLAB).map(([k,v])=>`<option value="${k}" ${sf===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
      <select id="colab-st" onchange="renderPage()">
        <option value="">Todos os contratos</option>
        ${['CLT','PJ','Temporário','Estágio','Autônomo','Intermitente'].map(t=>`<option value="${t}" ${st===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>

    ${list.length===0 ? `<div class="empty"><div class="empty-icon">👥</div><div class="empty-title">Nenhum colaborador encontrado</div><div class="empty-sub">Clique em "+ Novo Colaborador" para cadastrar</div></div>` : `
    <table>
      <thead><tr>
        <th>Colaborador</th><th>CPF</th><th>Cargo / Depto</th>
        <th>Contrato</th><th>Admissão</th><th>Salário</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>
        ${list.map(e=>{
          const sc = STATUS_COLAB[e.status]||STATUS_COLAB.ativo;
          const foto = e.foto
            ? `<img src="${e.foto}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0">`
            : av(e.nome,e.id);
          return `<tr>
            <td><div style="display:flex;align-items:center;gap:10px">
              ${foto}
              <div><div style="font-weight:700">${esc(e.nome)}</div>
              <div style="font-size:11px;color:var(--mt)">${esc(e.email||'')}</div></div>
            </div></td>
            <td style="font-size:12px">${esc(e.cpf||'—')}</td>
            <td><div style="font-weight:600">${esc(e.cargo||'—')}</div><div style="font-size:11px;color:var(--mt)">${esc(e.departamento||'')}</div></td>
            <td>${bdg(e.tipoContrato||'CLT','#2563EB')}</td>
            <td style="font-size:12px">${fmtDate(e.dataAdmissao)}</td>
            <td style="font-size:12px;font-weight:600">${e.salario?fBRL(e.salario):'—'}</td>
            <td>${bdg(sc.label,sc.color)}</td>
            <td>
              <div style="display:flex;gap:6px">
                <button class="btn btn-blue btn-sm" onclick="modalColaborador('${e.id}')">✏️</button>
                <button class="btn btn-red btn-sm" onclick="deleteColaborador('${e.id}')">🗑️</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  </div>`;
}

async function saveColaborador(id){
  const g = (i) => document.getElementById(i)?.value?.trim()||'';
  const nome = g('c-nome');
  const cpf  = g('c-cpf');
  const cargo= g('c-cargo');
  const admissao = g('c-admissao');
  if(!nome||!cpf||!cargo||!admissao){ toast('Preencha os campos obrigatórios (*)','err'); return; }

  // CPF único
  if(!id && APP.employees.find(e=>e.cpf===cpf)){
    toast('CPF já cadastrado','err'); return;
  }

  const emp = {
    id: id || uid(),
    nome, cpf,
    rg: g('c-rg'), pis: g('c-pis'),
    email: g('c-email'), telefone: g('c-tel'),
    rua: g('c-rua'), numero: g('c-num'),
    bairro: g('c-bairro'), cidade: g('c-cidade'), cep: g('c-cep'),
    tipoContrato: g('c-tipo'),
    cargo, departamento: g('c-depto'),
    dataAdmissao: admissao,
    dataDemissao: g('c-demissao'),
    status: g('c-status'),
    salario: parseFloat(document.getElementById('c-sal')?.value||0)||0,
    cargaHoraria: parseInt(document.getElementById('c-ch')?.value||44)||44,
    banco: g('c-banco'), agencia: g('c-agencia'), conta: g('c-conta'),
    tipoConta: g('c-tconta'), pix: g('c-pix'),
    foto: g('c-foto'),
    criadoEm: id ? (APP.employees.find(e=>e.id===id)?.criadoEm||new Date().toISOString()) : new Date().toISOString(),
    atualizadoEm: new Date().toISOString(),
  };

  if(id){
    const idx = APP.employees.findIndex(e=>e.id===id);
    if(idx>=0) APP.employees[idx]=emp; else APP.employees.push(emp);
  } else {
    APP.employees.push(emp);
  }
  lsSave('employees');
  await fbSave('employees');
  closeModal();
  renderPage();
  toast(id?'✅ Colaborador atualizado':'✅ Colaborador cadastrado','ok');
}

function deleteColaborador(id){
  const e = APP.employees.find(x=>x.id===id);
  if(!e) return;
  // Verifica vínculos
  const temDoc = APP.advertencias.concat(APP.suspensoes,APP.faltas,APP.atestados,APP.holerites).some(x=>x.empId===id);
  const aviso = temDoc ? '<div class="alert alert-warn" style="margin-bottom:12px">⚠️ Este colaborador possui documentos vinculados. A exclusão não remove esses registros.</div>' : '';
  openModal('Confirmar exclusão',
    `${aviso}<p>Excluir <strong>${esc(e.nome)}</strong> definitivamente?</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-red" onclick="confirmDeleteColab('${id}')">🗑️ Excluir</button>`
  );
}

async function confirmDeleteColab(id){
  APP.employees = APP.employees.filter(e=>e.id!==id);
  lsSave('employees');
  await fbSave('employees');
  closeModal();
  renderPage();
  toast('Colaborador excluído','warn');
}

// ── Foto: upload ──
function onFotoUpload(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = (e)=>{ setFotoColab(e.target.result); };
  r.readAsDataURL(file);
}

function setFotoColab(dataUrl){
  document.getElementById('c-foto').value = dataUrl;
  const el = document.getElementById('foto-preview');
  el.outerHTML = `<img id="foto-preview" src="${dataUrl}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px">`;
}

function removerFotoColab(){
  document.getElementById('c-foto').value='';
  const el = document.getElementById('foto-preview');
  el.outerHTML = `<div id="foto-preview" style="width:80px;height:80px;border-radius:50%;background:#E2E8F0;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 8px">👤</div>`;
}

// ── Foto: câmera ──
let _camStream = null;
async function abrirCameraColab(){
  const wrap = document.getElementById('camera-colab');
  wrap.style.display = 'block';
  try {
    _camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    document.getElementById('cam-video').srcObject = _camStream;
  } catch(e){ toast('Câmera não disponível','err'); wrap.style.display='none'; }
}

function capturarFotoColab(){
  const v = document.getElementById('cam-video');
  const c = document.getElementById('cam-canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  const dataUrl = c.toDataURL('image/jpeg',0.7);
  setFotoColab(dataUrl);
  fecharCameraColab();
}

function fecharCameraColab(){
  if(_camStream){ _camStream.getTracks().forEach(t=>t.stop()); _camStream=null; }
  const wrap = document.getElementById('camera-colab');
  if(wrap) wrap.style.display='none';
}

function numPorExtenso(n){ const u=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove','vinte','vinte e um','vinte e dois','vinte e três','vinte e quatro','vinte e cinco','vinte e seis','vinte e sete','vinte e oito','vinte e nove','trinta']; return u[n]||String(n); }
